name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (e.g. v1.0.0) from the dispatched commit'
        required: false
        default: ''

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write      # needed to create the GitHub release on tag builds
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Detours
        uses: actions/checkout@v4
        with:
          repository: microsoft/Detours
          path: third_party/Detours

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DDETOURS_ROOT="${{ github.workspace }}/third_party/Detours"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run scenarios (inversion / deadlock / benchmark)
        shell: pwsh
        run: ./ci/run_tests.ps1 -BinDir build/bin/Release -OutDir results

      - name: Static-CRT DLL must not depend on the VC runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          Write-Host "dumpbin: $vs"
          $dep = & $vs /dependents build/bin/static/Release/LockDetector.dll
          $dep | Write-Host
          if ($dep -match 'VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase') { Write-Error 'static DLL still depends on the VC/UCRT runtime'; exit 1 }

      - name: Run scenarios against the static-CRT DLL
        shell: pwsh
        run: ./ci/run_tests.ps1 -BinDir build/bin/Release -DllPath build/bin/static/Release/LockDetector.dll -OutDir results_static

      - name: Collect link maps
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          Get-ChildItem -Recurse build -Include *.map | ForEach-Object { Copy-Item $_.FullName results }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results
            results_static

      - name: Package (source + binaries + test results)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        run: |
          $v = '${{ inputs.release_tag || github.ref_name }}'
          $name = "LockDetector-$v-x64"
          $d = "dist/$name"
          New-Item -ItemType Directory -Force -Path $d, "$d/test-results" | Out-Null
          $bin = 'build/bin/Release'
          foreach ($f in 'LockDetector.dll','LockDetector.pdb','LockViewer.exe','InversionDemo.exe','InversionDemoMT.exe') {
            if (Test-Path "$bin/$f") { Copy-Item "$bin/$f" $d } else { Write-Host "missing $f" }
          }
          Copy-Item results/* "$d/test-results" -ErrorAction SilentlyContinue
          # static-CRT variant: needs only KERNEL32.dll (no VC++ redistributable)
          New-Item -ItemType Directory -Force -Path "$d/static-crt", "$d/test-results-static-crt" | Out-Null
          foreach ($f in 'LockDetector.dll','LockDetector.pdb') { Copy-Item "build/bin/static/Release/$f" "$d/static-crt" -ErrorAction SilentlyContinue }
          Copy-Item results_static/* "$d/test-results-static-crt" -ErrorAction SilentlyContinue
          Copy-Item README.md, ORIGINAL_README.txt $d
          Copy-Item third_party/Detours/LICENSE.md "$d/Detours-LICENSE.md" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$d/*" -DestinationPath "dist/$name-bin.zip"
          git archive --format=zip --prefix="LockDetector-$v-src/" -o "dist/LockDetector-$v-src.zip" HEAD
          (Get-Content RELEASE_NOTES.md -Raw -Encoding UTF8).Replace('{{TAG}}', $v) | Set-Content dist/RELEASE_NOTES.md -Encoding UTF8
          Get-ChildItem dist/*.zip | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.release_tag || github.ref_name }}'
          gh release create $tag dist/*.zip `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "LockDetector $tag" `
            --notes-file dist/RELEASE_NOTES.md
